
name: Construire l'application Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
  KS_PASS: ${{ secrets.KS_PASS }}
  KEY_PASS: ${{ secrets.KEY_PASS }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
          npm install --save-dev @capacitor/cli

      - name: Verifier les fichiers web
        run: |
          test -f capacitor.config.json
          test -d www
          ls -la

      - name: Creer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Bloquer les captures d'ecran
        run: |
          python3 - <<'PY'
          import glob
          import re

          for f in glob.glob(
              "android/app/src/main/java/**/MainActivity.java",
              recursive=True
          ):
              s = open(f).read()
              if "FLAG_SECURE" in s:
                  continue

              pattern = r"(public class MainActivity extends BridgeActivity\s*\{)"
              replacement = (
                  r"\1\n"
                  "  @Override\n"
                  "  public void onCreate(android.os.Bundle b) {\n"
                  "    super.onCreate(b);\n"
                  "    getWindow().setFlags("
                  "android.view.WindowManager.LayoutParams.FLAG_SECURE, "
                  "android.view.WindowManager.LayoutParams.FLAG_SECURE);\n"
                  "  }\n"
              )
              s2 = re.sub(pattern, replacement, s)
              if s2 != s:
                  open(f, "w").write(s2)
                  print("Protection activee :", f)
              else:
                  print("A verifier manuellement :", f)
          PY

      - name: Construire l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CNAPPS-NIGER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Construire le bundle AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Signer le bundle AAB
        if: env.KEYSTORE_B64 != '' && env.KS_PASS != '' && env.KEY_PASS != '' && env.KEY_ALIAS != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          jarsigner \
            -keystore release.keystore \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm -f release.keystore

      - name: Publier le bundle AAB
        uses: actions/upload-artifact@v4
        with:
          name: CNAPPS-NIGER-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
