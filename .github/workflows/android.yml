name: Construire l'application Android
on:
  workflow_dispatch:
env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
  KS_PASS: ${{ secrets.KS_PASS }}
  KEY_PASS: ${{ secrets.KEY_PASS }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
          npm install -D @capacitor/cli @capacitor/assets
      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Bloquer les captures d'écran de l'application
        run: |
          python3 - <<'PY'
          import glob,re
          for f in glob.glob("android/app/src/main/java/**/MainActivity.java",recursive=True):
              s=open(f).read()
              if "FLAG_SECURE" in s: continue
              s2=re.sub(r"public class MainActivity extends BridgeActivity \{\s*\}","public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(android.os.Bundle b) {\n    super.onCreate(b);\n    getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE);\n  }\n}",s)
              print("patched" if s2!=s else "motif non trouve : captures d'ecran non bloquees")
              open(f,"w").write(s2)
          PY
      - name: Construire l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Construire le bundle de publication (AAB)
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Signer le bundle (si la clé est configurée)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          jarsigner -keystore release.keystore -storepass "$KS_PASS" -keypass "$KEY_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
