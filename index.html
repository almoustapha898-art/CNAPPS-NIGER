<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c5c">
<title>Consultation du nourrisson</title>
<style>
:root{--bg:#f1f6f5;--surf:#fff;--ink:#17302f;--mute:#5b7372;--line:#d3e1df;--pri:#0f5c5c;--pri-ink:#fff;--warn:#a85f00;--warn-bg:#fdf0da;--bad:#b3261e;--bad-bg:#fbe4e1;--ok:#1d7a47;--ok-bg:#e0f3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a1a;--surf:#152524;--ink:#e3efee;--mute:#92aaa8;--line:#294140;--pri:#4fc3b8;--pri-ink:#062423;--warn:#f0b44f;--warn-bg:#3a2c10;--bad:#ff8f85;--bad-bg:#3d1b18;--ok:#74d19b;--ok-bg:#163826}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a1a;--surf:#152524;--ink:#e3efee;--mute:#92aaa8;--line:#294140;--pri:#4fc3b8;--pri-ink:#062423;--warn:#f0b44f;--warn-bg:#3a2c10;--bad:#ff8f85;--bad-bg:#3d1b18;--ok:#74d19b;--ok-bg:#163826}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{background:var(--pri);color:var(--pri-ink);padding:14px 16px}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);padding:10px 14px;border-radius:8px}
button.p{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:8px}
.item small{color:var(--mute);display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:700;margin-left:4px}
.t-bad{background:var(--bad-bg);color:var(--bad)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{font-size:.85rem;color:var(--mute);display:block;margin-bottom:3px}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:8px;font-weight:700}
.vac{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.vac:first-of-type{border-top:0}.vac div{flex:1}.vac small{color:var(--mute)}
.vac input[type=date]{width:150px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hb{background:transparent;color:inherit;border:1px solid currentColor;padding:3px 10px;font-size:.8rem;margin-left:8px;border-radius:6px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.note{font-size:.8rem;color:var(--mute)}
svg text{fill:var(--mute);font-size:11px}
</style>
</head>

 const out=[],vs=k.visits||[],l=vs[vs.length-1];

 <div class="card"><h2>Nouvelle consultation</h2><div class="grid">
 <div><label for="vd">Date</label><input id="vd" type="date" value="${today()}" max="${today()}"></div>
 <div><label for="vp">Poids (kg)</label><input id="vp" type="number" step="0.01"></div>
 <div><label for="vt">Taille (cm) : couchée avant 24 mois, debout ensuite</label><input id="vt" type="number" step="0.1"></div>
 <div><label for="vc">Périmètre crânien (cm)</label><input id="vc" type="number" step="0.1"></div>
 <div><label for="vb">PB (mm), dès 6 mois</label><input id="vb" type="number"></div>
 <div><label for="vk">Température (°C)</label><input id="vk" type="number" step="0.1"></div>
 <div><label for="va">Alimentation</label><select id="va"><option value="">—</option><option value="exclusif">Allaitement exclusif</option><option value="mixte">Allaitement mixte</option><option value="artificiel">Lait artificiel</option><option value="diversifie">Diversifiée (dès 6 mois)</option></select></div>
 <div><label for="vo">Œdèmes bilatéraux</label><select id="vo"><option value="">Non</option><option value="+">+</option><option value="++">++</option><option value="+++">+++</option></select></div></div>
 <p id="zl" class="note" aria-live="polite" style="margin:8px 0 0;font-weight:700"></p><h3 style="margin:14px 0 2px;font-size:1rem">Évaluation PCIME</h3><p class="note" style="margin:0 0 8px">Champs inspirés de la fiche individuelle de prise en charge (PCIME-C) du Niger.</p>
 <fieldset style="border:1px solid var(--line);border-radius:8px;margin:0 0 10px"><legend>Signes généraux de danger</legend>${[["boire","Incapable de boire ou téter"],["vomit","Vomit tout"],["conv","Convulsions"],["leth","Léthargique ou inconscient"]].map(([a,b])=>`<label style="display:inline-flex;gap:6px;margin-right:14px;color:var(--ink)"><input type="checkbox" class="sgd" value="${a}" style="width:auto">${b}</label>`).join("")}</fieldset>
 <div class="grid"><div><label for="xt">Toux / respiration difficile (jours)</label><input id="xt" type="number" min="0" placeholder="0 = non"></div>
 <div><label for="xd">Diarrhée (jours)</label><input id="xd" type="number" min="0" placeholder="0 = non"></div>
 <div><label for="xs">Sang dans les selles</label><select id="xs"><option value="">Non</option><option value="1">Oui</option></select></div>
 <div><label for="xf">Fièvre (jours)</label><input id="xf" type="number" min="0" placeholder="0 = non"></div>
 <div><label for="xv">Vitamine A donnée</label><select id="xv"><option value="">Non</option><option value="1">Oui</option></select></div>
 <div><label for="xa">Albendazole donné</label><select id="xa"><option value="">Non</option><option value="1">Oui</option></select></div>
 <div><label for="xc">Décision</label><select id="xc"><option value="">—</option><option>Traité sur place</option><option>Référé</option><option>Visite de suivi (J3)</option></select></div></div>
 <h3 style="margin:14px 0 2px;font-size:1rem">Malnutrition aiguë</h3><p class="note" style="margin:0 0 8px">Quand les critères sont atteints, l'enfant est admis automatiquement au CRENAS, au CRENAM ou au CRENI.</p>
 <div class="grid"><div><label for="ap">Test d'appétit</label><select id="ap"><option value="">Non fait</option><option value="ok">Réussi</option><option value="echec">Échec</option></select></div></div>
 <fieldset style="border:1px solid var(--line);border-radius:8px;margin:10px 0"><legend>Complications médicales associées</legend>${cbx("vco",[["pneu","Pneumonie sévère"],["deshy","Déshydratation"],["fievre","Fièvre élevée"],["pale","Anémie sévère (pâleur)"],["vomit","Vomissements incessants"],["leth","Léthargie ou inconscience"],["conv","Convulsions"]])}</fieldset>
 <p id="zadm" class="note" role="status" style="font-weight:700;margin:0 0 8px"></p>
 <h3 style="margin:14px 0 6px;font-size:1rem">Suivi de la croissance (fiche)</h3><div class="grid"><div><label for="ea">Évaluation de l'alimentation</label><input id="ea"></div><div><label for="ec">Conseils individuels</label><input id="ec"></div><div><label for="ed">Développement psychomoteur</label><select id="ed"><option value="">Non évalué</option><option>Normal</option><option>À surveiller</option><option>Retard</option></select></div></div>
 <label for="vn" style="margin-top:10px">Observations et événements importants (hospitalisation, maladie, récupération nutritionnelle)</label><textarea id="vn" rows="2"></textarea>
 <div class="bar" style="margin:10px 0 0"><button class="p" id="addv">Enregistrer la consultation</button></div></div>
 <div class="card"><h2>G. Courbes de croissance (normes OMS)</h2><h3 style="margin:0 0 4px;font-size:.95rem">Poids pour l'âge</h3>${chart(vs,k)}<h3 style="margin:14px 0 4px;font-size:.95rem">Taille couchée pour l'âge</h3>${chartLA(vs,k)}<h3 style="margin:14px 0 4px;font-size:.95rem">Poids pour la taille</h3>${chartWL(vs,k)}<p class="note">Lignes OMS 2006 : médiane (0), ±2 et ±3 écarts-types sur les courbes taille/âge et poids/taille ; −3, −2, 0 et +2 sur poids/âge. Poids/âge et taille/âge : tables de 0 à 24 mois ; poids/taille : de 6 à 59 mois.</p></div>
 ${mnpCard(k)}
 ${nutCard(k)}${vacCard(k)}
 ${ptmeCard(k)}<div class="card"><h2>E. Suivi de la croissance : historique</h2>${vs.length?`<div class="scroll"><table><tr><th>Date</th><th>Âge</th><th>Poids</th><th>Z P/Â</th><th>Taille</th><th>Z T/Â</th><th>Z P/T</th><th>PC</th><th>PB</th><th>T°</th><th>Décision</th><th>Notes</th><th>Alimentation, conseils, développement</th><th></th></tr>${[...vs].reverse().map((v,i)=>`<tr><td>${fmt(v.date)}</td><td>${age(k.dob,v.date)}</td><td>${v.poids??""}</td><td>${zTag(k,v)}</td><td>${v.taille??""}</td><td>${zTagHA(k,v)}</td><td>${zTagWL(k,v)}</td><td>${v.pc??""}</td><td>${v.pb??""}</td><td>${v.temp??""}</td><td>${esc(v.decision)}</td><td>${esc(v.note)}</td><td>${esc([v.alim&&"Alim. : "+v.alim,v.conseil&&"Conseils : "+v.conseil,v.dev&&"Dév. : "+v.dev].filter(Boolean).join(" · "))}</td><td><button class="dv" data-i="${i}" aria-label="Supprimer la consultation du ${fmt(v.date)}">Supprimer</button></td></tr>`).join("")}</table></div>`:'<div class="empty">Aucune consultation enregistrée.</div>'}</div>
 ${infoCard(k)}
 <div id="delbox"><button id="del">Supprimer ce dossier</button></div>`;
 $("#back").onclick=list;nutBind(k);extraBind(k);S.flash=null;
 const zl=()=>{$("#zl").textContent=zLine(k,$("#vd").value,+$("#vp").value||null,+$("#vt").value||null)};
 ["#vd","#vp","#vt"].forEach(i=>$(i).oninput=zl);
 const prev=()=>{const n=id=>+$(id).value||null,v={date:$("#vd").value,poids:n("#vp"),taille:n("#vt"),pb:n("#vb"),oed:!!$("#vo").value,sgd:[...document.querySelectorAll(".sgd:checked")].map(c=>c.value)};
  const r=orientNut(k,v,{date:v.date,appetit:$("#ap").value,oed:$("#vo").value,compl:[...document.querySelectorAll(".vco:checked")].map(c=>c.value)});
  $("#zadm").textContent=r.type?(k.nut&&!k.nut.sortie?"Enfant déjà en prise en charge au "+progOf(k.nut.orient)+".":"Admission automatique : "+(r.type==="MAS"?"malnutrition aiguë sévère":"malnutrition aiguë modérée")+" → "+r.orient+(r.why.length?" ("+r.why.join(" ; ")+")":"")):(r.age&&classNut(k,v)?r.why[0]:"")};
 ["#vd","#vp","#vt","#vb","#vo","#ap"].forEach(i=>{const e=$(i);if(e){e.addEventListener("input",prev);e.addEventListener("change",prev)}});
 document.querySelectorAll(".sgd,.vco").forEach(c=>c.addEventListener("change",prev));
 $("#addv").onclick=()=>{
  const n=id=>+$(id).value||null,v={date:$("#vd").value,poids:n("#vp"),taille:n("#vt"),pc:n("#vc"),pb:n("#vb"),temp:n("#vk"),allait:$("#va").value,oed:!!$("#vo").value,note:$("#vn").value.trim(),appetit:$("#ap").value,oedg:$("#vo").value,compl:[...document.querySelectorAll(".vco:checked")].map(c=>c.value),alim:$("#ea").value.trim(),conseil:$("#ec").value.trim(),dev:$("#ed").value,sgd:[...document.querySelectorAll(".sgd:checked")].map(c=>c.value),toux:n("#xt"),diar:n("#xd"),sang:!!$("#xs").value,fievre:n("#xf"),vita:!!$("#xv").value,alb:!!$("#xa").value,decision:$("#xc").value};
  if(!v.date||!(v.poids||v.taille||v.pc||v.pb||v.temp||v.note||v.sgd.length||v.toux||v.diar||v.fievre||v.decision||v.alim||v.conseil||v.dev||v.appetit))return;
  k.visits.push(v);autoAdmit(k,v);save();detail();
 };
 document.querySelectorAll("[data-v]").forEach(i=>i.onchange=()=>{k.vac=k.vac||{};if(i.value)k.vac[i.dataset.v]=i.value;else delete k.vac[i.dataset.v];save();detail()});
 $("#del").onclick=()=>{
  $("#delbox").innerHTML=`<div class="alert t-bad">Supprimer définitivement le dossier de ${esc(k.nom)} ? Toutes ses consultations, vaccins et sa prise en charge nutritionnelle seront effacés. Cette action est irréversible : pensez à exporter une sauvegarde avant.</div><div class="bar"><button id="delno">Annuler</button><button class="p" id="delyes" style="background:var(--bad);border-color:var(--bad)">Oui, supprimer</button></div>`;
  $("#delno").onclick=detail;
  $("#delyes").onclick=()=>{S.kids=S.kids.filter(x=>x.id!==k.id);S.sel=null;save();list()};
 };
 document.querySelectorAll(".dv").forEach(b=>b.onclick=()=>{
  const v=[...vs].reverse()[+b.dataset.i];
  if(b.dataset.ok){const j=k.visits.indexOf(v);if(j>=0)k.visits.splice(j,1);save();detail();return}
  b.dataset.ok=1;b.textContent="Confirmer ?";b.style.background="var(--bad)";b.style.color="#fff";
 });
}
boot();
</script>
</body>
</html>
